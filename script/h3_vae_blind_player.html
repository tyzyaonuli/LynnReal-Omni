<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>三路 VAE 盲看对比</title><style>
body{background:#10131a;color:#edf1f7;font:16px system-ui;margin:24px auto;max-width:1900px;padding:0 20px}button,select{padding:10px;margin:5px;background:#24334b;color:white;border:1px solid #46546a;border-radius:6px;cursor:pointer}.pair{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;min-width:780px}.viewport{overflow-x:auto}video{width:100%;background:#000;aspect-ratio:7/4}h3{min-height:1.6em}pre{white-space:pre-wrap;color:#b3c5dc}#prompt{line-height:1.5}.muted{color:#aebcd0;font-size:14px}#status{color:#f0ce87;min-height:1.5em}[hidden]{display:none!important}
</style><h1>三路 VAE 盲看对比</h1>
<p class="muted">10 组 · 1344×768 · 124 帧 · 24 fps。每组独立随机排列，本次打开期间保持不变。默认隐藏名称与指标，揭晓后切换用例会重新隐藏。</p>
<button id="prev">上一组</button><button id="next">下一组</button><button id="play">同步播放</button><button id="pause">暂停</button><button id="all">顺序播放全部</button><button id="reveal" aria-pressed="false">显示 VAE 名称</button><button id="shuffle">重新随机排列</button>
<label>音轨 <select id="audio"><option value="mute">静音</option><option value="0">左侧</option><option value="1">中间</option><option value="2">右侧</option></select></label>
<h2 id="title"></h2><p id="prompt"></p><p id="info" class="muted"></p>
<div class="viewport"><div class="pair">
<section><h3 id="label0"></h3><video id="v0" playsinline controls preload="metadata"></video><pre id="m0" hidden></pre></section>
<section><h3 id="label1"></h3><video id="v1" playsinline controls preload="metadata"></video><pre id="m1" hidden></pre></section>
<section><h3 id="label2"></h3><video id="v2" playsinline controls preload="metadata"></video><pre id="m2" hidden></pre></section>
</div></div><p id="status" role="status"></p>
<p class="muted">__COMPARISON_NOTE__</p>
<p id="source" hidden class="muted">__SOURCE_NOTE__</p>
<script>
const cases=__DATA__, $=id=>document.getElementById(id), videos=[0,1,2].map(n=>$('v'+n));
let index=0, revealed=false, sequential=false, loading=false, syncing=false, advancing=false;
const positions=['左侧','中间','右侧'];
function randomOrder(){const a=[0,1,2];for(let j=2;j>0;j--){const x=new Uint32Array(1);crypto.getRandomValues(x);const k=Math.floor(x[0]/4294967296*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
let orders=cases.map(randomOrder);
function entries(){const c=cases[index];return [{name:'H3 默认 VAE',src:c.a,metrics:c.a_metrics},{name:'LynnReal Light VAE',src:c.b,metrics:c.b_metrics},{name:'TAEHV taeh3',src:c.c,metrics:c.c_metrics}];}
function labels(){const e=entries();orders[index].forEach((which,n)=>{const item=e[which];$('label'+n).textContent=revealed?positions[n]+' · '+item.name:positions[n]+' · 视频 '+(n+1);$('m'+n).hidden=!revealed;$('m'+n).textContent=item.metrics?`解码 ${(item.metrics.wall_seconds*1000).toFixed(1)} ms · 峰值 allocated ${(item.metrics.peak_allocated_bytes/2**30).toFixed(2)} GiB`:'历史参考；不作跨硬件耗时比较';});$('reveal').textContent=revealed?'隐藏 VAE 名称':'显示 VAE 名称';$('reveal').setAttribute('aria-pressed',String(revealed));$('source').hidden=!revealed;}
function sound(){videos.forEach((v,n)=>v.muted=$('audio').value!==String(n));}
function pause(){videos.forEach(v=>v.pause());}
function load(n){loading=true;pause();index=(n+cases.length)%cases.length;revealed=false;advancing=false;const c=cases[index],e=entries();$('title').textContent=`${index+1}/${cases.length} ${c.title}`;$('prompt').textContent=c.prompt;$('info').textContent=`seed ${c.seed} · ${c.id}`;$('status').textContent='';orders[index].forEach((which,n)=>{videos[n].src=e[which].src;});labels();sound();loading=false;}
async function play(){try{await Promise.all(videos.map(v=>v.play()));}catch(error){pause();sequential=false;$('status').textContent='播放未完成，请重试：'+error.message;}}
$('play').onclick=play;$('pause').onclick=()=>{sequential=false;pause()};$('prev').onclick=()=>{sequential=false;load(index-1)};$('next').onclick=()=>{sequential=false;load(index+1)};
$('all').onclick=()=>{sequential=true;load(0);play()};$('reveal').onclick=()=>{revealed=!revealed;labels()};$('audio').onchange=sound;
$('shuffle').onclick=()=>{sequential=false;const old=orders[index].join();let fresh;do{fresh=randomOrder()}while(fresh.join()===old);orders[index]=fresh;load(index)};
videos.forEach((v,n)=>{v.addEventListener('error',()=>{$('status').textContent=positions[n]+'视频加载失败，请检查网络后重试。'});v.addEventListener('seeking',()=>{if(loading||syncing)return;syncing=true;videos.forEach(other=>{if(other!==v&&other.readyState>=2&&Math.abs(other.currentTime-v.currentTime)>.12)other.currentTime=v.currentTime});syncing=false});v.addEventListener('ended',()=>{if(advancing)return;advancing=true;pause();if(sequential&&index+1<cases.length){load(index+1);play()}else{sequential=false;$('status').textContent='本组播放完成。'}});});
setInterval(()=>{const master=videos[0];if(master.paused||master.seeking)return;videos.slice(1).forEach(v=>{if(!v.paused&&!v.seeking&&v.readyState>=2&&Math.abs(v.currentTime-master.currentTime)>.15)v.currentTime=master.currentTime})},250);load(0);
</script></html>
